<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92" role="img" aria-label="THE MEMES.net">
  <defs>
    <radialGradient id="tmf-halo" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#8a3dff" stop-opacity="0.34"/>
      <stop offset="58%" stop-color="#ff2e88" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#07060f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tmf-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="55%" stop-color="#ff2e88"/>
      <stop offset="100%" stop-color="#8a3dff"/>
    </linearGradient>
    <pattern id="tmf-stripes" width="92" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="92" height="3.8" fill="#ffffff"/>
      <rect x="0" y="3.8" width="92" height="2.2" fill="#000000"/>
    </pattern>
    <mask id="tmf-sunmask">
      <rect x="0" y="0" width="92" height="92" fill="url(#tmf-stripes)"/>
    </mask>
    <linearGradient id="tmf-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19f0ff"/>
      <stop offset="50%" stop-color="#8a3dff"/>
      <stop offset="100%" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="tmf-chrome" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="66"><stop offset="0%" stop-color="#2c1d6e"/><stop offset="28%" stop-color="#45e3ff"/><stop offset="47%" stop-color="#ffffff"/><stop offset="51%" stop-color="#22082e"/><stop offset="58%" stop-color="#ff2e88"/><stop offset="82%" stop-color="#ff8a3d"/><stop offset="100%" stop-color="#ffe787"/></linearGradient>
    <linearGradient id="tmf-rim" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="66"><stop offset="0%" stop-color="#c9fbff"/><stop offset="48%" stop-color="#ffffff"/><stop offset="54%" stop-color="#ff6cb0"/><stop offset="100%" stop-color="#ffd269"/></linearGradient>
    <linearGradient id="tmf-extrude" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="66"><stop offset="0%" stop-color="#5a198f"/><stop offset="100%" stop-color="#ff1a75"/></linearGradient>
    <linearGradient id="tmf-bar" gradientUnits="userSpaceOnUse" x1="14" y1="76" x2="78" y2="76">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="52%" stop-color="#ff2e88"/>
      <stop offset="100%" stop-color="#19f0ff"/>
    </linearGradient>
    <filter id="tmf-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tmf-cyan" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
