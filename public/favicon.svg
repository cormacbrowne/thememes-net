<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14" />
      <stop offset="55%" stop-color="#17092e" />
      <stop offset="100%" stop-color="#05060c" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="55%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="lensCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="lensPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00f3ff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Cyber Badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="20" />
  <rect x="34" y="34" width="444" height="444" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Electric Aura Circles -->
  <circle cx="256" cy="272" r="192" fill="#a855f7" opacity="0.16" />
  <circle cx="256" cy="272" r="148" fill="#00f3ff" opacity="0.12" />

  <!-- Left & Right High-Voltage Lightning Wings -->
  <polygon points="84,158 34,238 80,244 46,326 124,228 78,220" fill="#00f3ff" stroke="#070810" stroke-width="8" stroke-linejoin="round" />
  <polygon points="428,158 478,238 432,244 466,326 388,228 434,220" fill="#ec4899" stroke="#070810" stroke-width="8" stroke-linejoin="round" />

  <!-- Crazy Mascot Head -->
  <circle cx="256" cy="284" r="138" fill="url(#faceGrad)" stroke="#070810" stroke-width="14" filter="url(#neonGlow)" />

  <!-- Tilted Cyber King Crown -->
  <g transform="rotate(-6 256 128)">
    <polygon
      points="126,168 142,68 204,122 256,46 308,122 370,68 386,168"
      fill="url(#crownGrad)"
      stroke="#070810"
      stroke-width="14"
      stroke-linejoin="round"
    />
    <circle cx="142" cy="62" r="14" fill="#00f3ff" stroke="#070810" stroke-width="6" />
    <circle cx="256" cy="40" r="18" fill="#ec4899" stroke="#070810" stroke-width="6" />
    <circle cx="370" cy="62" r="14" fill="#00f3ff" stroke="#070810" stroke-width="6" />
    <rect x="132" y="148" width="248" height="22" rx="8" fill="#070810" />
    <circle cx="190" cy="159" r="6" fill="#00f3ff" />
    <circle cx="256" cy="159" r="6" fill="#facc15" />
    <circle cx="322" cy="159" r="6" fill="#ec4899" />
  </g>

  <!-- Crooked "DEAL WITH IT" Pixel Arcade Shades -->
  <g transform="rotate(-4 256 242)">
    <!-- Black Pixel Frame -->
    <path
      d="M92,208 H420 V236 H398 V268 H376 V288 H282 V268 H268 V240 H244 V268 H230 V288 H136 V268 H114 V236 H92 Z"
      fill="#070810"
      stroke="#ffffff"
      stroke-width="6"
      stroke-linejoin="round"
    />
    <!-- Left Cyan Neon Lens -->
    <rect x="124" y="222" width="102" height="52" rx="6" fill="url(#lensCyan)" />
    <!-- Right Pink Neon Lens -->
    <rect x="286" y="222" width="102" height="52" rx="6" fill="url(#lensPink)" />
    <!-- Pixel Specular Glint Bars -->
    <rect x="136" y="230" width="18" height="36" fill="#ffffff" opacity="0.9" />
    <rect x="162" y="230" width="10" height="36" fill="#ffffff" opacity="0.75" />
    <rect x="298" y="230" width="18" height="36" fill="#ffffff" opacity="0.9" />
    <rect x="324" y="230" width="10" height="36" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Manic Unhinged Arcade Grin -->
  <path
    d="M148,314 Q256,356 364,314 C358,388 312,410 256,410 C200,410 154,388 148,314 Z"
    fill="#070810"
    stroke="#070810"
    stroke-width="12"
    stroke-linejoin="round"
  />
  <!-- Upper & Lower Cartoon Teeth + Gold Tooth -->
  <path d="M166,321 Q256,348 346,321 L340,348 Q256,370 172,348 Z" fill="#ffffff" />
  <polygon points="282,331 312,327 308,354 278,357" fill="#facc15" stroke="#070810" stroke-width="3" />
  <line x1="210" y1="326" x2="210" y2="354" stroke="#070810" stroke-width="6" />
  <line x1="256" y1="333" x2="256" y2="360" stroke="#070810" stroke-width="6" />
  <line x1="282" y1="330" x2="280" y2="357" stroke="#070810" stroke-width="6" />
  <line x1="312" y1="326" x2="310" y2="353" stroke="#070810" stroke-width="6" />

  <!-- Wild Tongue Out -->
  <path d="M222,368 Q256,358 290,368 C296,406 278,432 256,432 C234,432 216,406 222,368 Z" fill="#ff2a85" stroke="#070810" stroke-width="8" />
  <line x1="256" y1="372" x2="256" y2="412" stroke="#9d174d" stroke-width="6" stroke-linecap="round" />

  <!-- Bottom Neon "MEMES" Pill Tag -->
  <rect x="116" y="424" width="280" height="54" rx="27" fill="#070810" stroke="#00f3ff" stroke-width="8" />
  <text
    x="256"
    y="461"
    font-family="Impact, 'Arial Black', sans-serif"
    font-size="38"
    font-weight="900"
    fill="#facc15"
    text-anchor="middle"
    letter-spacing="3"
  >
    THE MEMES
  </text>
</svg>
