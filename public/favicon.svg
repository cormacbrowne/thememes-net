<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14" />
      <stop offset="55%" stop-color="#17092e" />
      <stop offset="100%" stop-color="#05060c" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00f3ff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Cyber Badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="20" />
  <circle cx="256" cy="272" r="192" fill="none" stroke="url(#rimGrad)" stroke-width="8" opacity="0.65" />

  <!-- Neon Gaming Headphones Arch & Ear Cups -->
  <path d="M98,284 A158,158 0 0,1 414,284" fill="none" stroke="url(#headsetGrad)" stroke-width="26" stroke-linecap="round" />
  <rect x="68" y="232" width="46" height="114" rx="23" fill="#00f3ff" stroke="#070810" stroke-width="10" />
  <rect x="398" y="232" width="46" height="114" rx="23" fill="#ec4899" stroke="#070810" stroke-width="10" />

  <!-- Joyful Beaming Mascot Head -->
  <circle cx="256" cy="288" r="134" fill="url(#faceGrad)" stroke="#070810" stroke-width="12" filter="url(#neonGlow)" />

  <!-- Tilted Golden Star Crown -->
  <g transform="rotate(8 256 125)">
    <polygon
      points="146,166 158,76 212,124 256,52 300,124 354,76 366,166"
      fill="url(#crownGrad)"
      stroke="#070810"
      stroke-width="12"
      stroke-linejoin="round"
    />
    <circle cx="158" cy="70" r="12" fill="#00f3ff" stroke="#070810" stroke-width="5" />
    <circle cx="256" cy="46" r="15" fill="#facc15" stroke="#070810" stroke-width="5" />
    <circle cx="354" cy="70" r="12" fill="#ec4899" stroke="#070810" stroke-width="5" />
  </g>

  <!-- Friendly Sparkling Anime/Arcade Eyes -->
  <ellipse cx="204" cy="256" rx="22" ry="26" fill="#070810" />
  <ellipse cx="308" cy="256" rx="22" ry="26" fill="#070810" />
  <circle cx="197" cy="246" r="9" fill="#ffffff" />
  <circle cx="212" cy="264" r="4" fill="#00f3ff" />
  <circle cx="301" cy="246" r="9" fill="#ffffff" />
  <circle cx="316" cy="264" r="4" fill="#00f3ff" />

  <!-- Rosy Neon Cheeks -->
  <ellipse cx="164" cy="292" rx="22" ry="12" fill="#ec4899" opacity="0.75" />
  <ellipse cx="348" cy="292" rx="22" ry="12" fill="#ec4899" opacity="0.75" />

  <!-- Big Friendly Happy Laughing Smile -->
  <path
    d="M182,310 Q256,338 330,310 C324,376 292,396 256,396 C220,396 188,376 182,310 Z"
    fill="#070810"
    stroke="#070810"
    stroke-width="10"
    stroke-linejoin="round"
  />
  <path d="M196,316 Q256,336 316,316 L310,336 Q256,352 202,336 Z" fill="#ffffff" />
  <ellipse cx="256" cy="374" rx="34" ry="16" fill="#fb7185" />

  <!-- Gamer Headset Mic Boom -->
  <path d="M412,332 Q382,392 308,392" fill="none" stroke="#00f3ff" stroke-width="10" stroke-linecap="round" />
  <rect x="284" y="380" width="32" height="20" rx="10" fill="#00f3ff" stroke="#070810" stroke-width="5" />
</svg>
